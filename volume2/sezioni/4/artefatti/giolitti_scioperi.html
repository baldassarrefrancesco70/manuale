<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sciopero economico o politico? Decidi come Giolitti</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #F2EDE4;
    color: #1C1A17;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: #1C1A17;
    padding: 1.5rem 2.5rem 1.3rem;
    border-bottom: 3px solid #6B5C3E;
  }
  .header-eyebrow {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 0.72rem;
    color: #8B7A5A;
    letter-spacing: 0.08em;
    margin-bottom: 0.4rem;
  }
  .header-title {
    font-size: 1.2rem;
    font-weight: normal;
    color: #EDE5D8;
    line-height: 1.35;
  }
  .header-title strong { font-weight: normal; font-style: italic; color: #C8AA78; }
  .header-sub {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 0.76rem;
    color: #6B5C3E;
    margin-top: 0.4rem;
    line-height: 1.5;
  }

  /* ── PROGRESS DOTS ── */
  .progress-strip {
    background: #E8E0D0;
    border-bottom: 1px solid #D4C9B4;
    padding: 0.65rem 2.5rem;
    display: flex;
    align-items: center;
    gap: 1.25rem;
  }
  .dots {
    display: flex;
    gap: 6px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #C4BAA8;
    transition: background 0.3s;
  }
  .dot.done    { background: #5A7A4A; }
  .dot.current { background: #6B5C3E; }
  .progress-text {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 11px;
    color: #8B7A5A;
  }

  /* ── MAIN ── */
  .main {
    padding: 2rem 2.5rem;
    max-width: 820px;
    margin: 0 auto;
  }

  /* ── CASE CARD ── */
  .case-card {
    background: #FFFDF8;
    border: 1.5px solid #C8BAA0;
    border-radius: 2px;
    margin-bottom: 1.25rem;
    overflow: hidden;
  }

  .case-tag {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 1.25rem;
    background: #F5F0E4;
    border-bottom: 1px solid #D4C9B4;
  }
  .case-num {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #8B7A5A;
  }
  .case-year {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #1C1A17;
    background: #E0D4BC;
    padding: 1px 8px;
    border-radius: 2px;
  }
  .case-title {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 12px;
    color: #5A4A2A;
    flex: 1;
  }

  .case-body {
    padding: 1.1rem 1.25rem;
  }
  .case-text {
    font-size: 0.9rem;
    line-height: 1.75;
    color: #2C2820;
    margin-bottom: 0;
  }

  /* ── DECISION STEPS ── */
  .step {
    margin-top: 1.1rem;
    padding-top: 1rem;
    border-top: 1px solid #E0D8C8;
  }

  .step-prompt {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 0.8rem;
    color: #5A4A2A;
    margin-bottom: 0.65rem;
    font-style: italic;
  }

  .choices {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .choice-btn {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 12.5px;
    padding: 7px 18px;
    border-radius: 2px;
    border: 1.5px solid #C8BAA0;
    background: #F5F0E4;
    color: #2C2820;
    cursor: pointer;
    transition: all 0.16s;
    line-height: 1.3;
  }
  .choice-btn:hover:not(:disabled) {
    border-color: #6B5C3E;
    background: #EDE5D4;
  }
  .choice-btn:disabled { cursor: default; opacity: 0.6; }
  .choice-btn.selected-correct {
    background: #DFF0D8;
    border-color: #5A7A4A;
    color: #2A4A1A;
    opacity: 1;
  }
  .choice-btn.selected-neutral {
    background: #E8E0CC;
    border-color: #8B7A5A;
    color: #3A3020;
    opacity: 1;
  }

  /* ── REVEAL PANEL ── */
  .reveal {
    display: none;
    margin-top: 0.9rem;
    padding: 0.9rem 1.1rem;
    border-left: 3px solid #6B5C3E;
    background: #F0EAD8;
    border-radius: 0 2px 2px 0;
    animation: fadeIn 0.25s ease;
  }
  .reveal.show { display: block; }
  .reveal.ambiguous { border-left-color: #8B5A3A; background: #F5EDD8; }

  .reveal-label {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #8B7A5A;
    margin-bottom: 0.35rem;
    text-transform: uppercase;
  }
  .reveal-label.ambiguous-lbl { color: #8B5A3A; }
  .reveal-text {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 0.82rem;
    color: #2C2820;
    line-height: 1.72;
  }

  /* ── NEXT BUTTON ── */
  .next-btn {
    display: none;
    margin-top: 1rem;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 12.5px;
    padding: 7px 20px;
    border-radius: 2px;
    border: 1.5px solid #1C1A17;
    background: #1C1A17;
    color: #EDE5D8;
    cursor: pointer;
    transition: all 0.16s;
  }
  .next-btn:hover { background: #3A3428; border-color: #3A3428; }
  .next-btn.show { display: inline-block; }

  /* ── CLOSING NOTE ── */
  .closing {
    display: none;
    background: #1C1A17;
    border-radius: 2px;
    padding: 1.4rem 1.75rem;
    margin-top: 0.5rem;
    animation: fadeIn 0.35s ease;
  }
  .closing.show { display: block; }
  .closing-label {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #8B7A5A;
    margin-bottom: 0.55rem;
  }
  .closing-text {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
    font-size: 0.84rem;
    color: #C8BAA0;
    line-height: 1.75;
  }
  .closing-text strong { color: #EDE5D8; font-weight: normal; font-style: italic; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-eyebrow">Il metodo giolittiano · esercizio decisionale</div>
  <div class="header-title">Sciopero economico o politico? <strong>Decidi come Giolitti</strong></div>
  <div class="header-sub">Cinque casi reali o costruiti. Per ciascuno: classifica l'agitazione, poi scegli la risposta dello Stato. Poi confronta con quello che accadde davvero.</div>
</div>

<div class="progress-strip">
  <div class="dots" id="dots"></div>
  <div class="progress-text" id="progressText">Caso 1 di 5</div>
</div>

<div class="main" id="main"></div>

<script>
// ══════════════════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════════════════
const CASES = [
  {
    num: 1,
    year: '1904',
    title: 'Lo sciopero generale di settembre',
    text: 'Settembre 1904. Dopo l\'uccisione di alcuni scioperanti a opera della forza pubblica in Sardegna e in Sicilia, le organizzazioni sindacali proclamano uno sciopero generale di solidarietà. In pochi giorni l\'agitazione si estende a tutta la penisola: si fermano i trasporti, le fabbriche, i servizi urbani. I manifesti degli organizzatori parlano di "protesta contro la violenza dello Stato". Le rivendicazioni salariali, se ci sono, passano in secondo piano rispetto alla denuncia politica. Le prefetture riferiscono ordine pubblico sostanzialmente mantenuto.',
    step1: {
      prompt: 'Come classificheresti questa agitazione?',
      opts: ['Sciopero economico', 'Sciopero politico'],
      correct: 1,
      reveal: 'Giolitti lo classificò come sciopero politico, ma scelse una risposta che molti dei suoi colleghi considerarono scandalosa: non intervenne. "Lo Stato non può essere difeso dai nemici della libertà se esso stesso viola la libertà," disse in sostanza. Lasciò che l\'agitazione si consumasse da sola nel giro di pochi giorni, senza vittime né arresti di massa. La scommessa fu che la mancanza di repressione privasse lo sciopero del suo carburante politico — e così avvenne. Alle elezioni successive la Sinistra socialista non guadagnò, e il governo ne uscì rafforzato.'
    },
    step2: {
      prompt: 'Quale dovrebbe essere la risposta dello Stato?',
      opts: ['Neutralità — non intervenire', 'Mediazione tramite conciliazione', 'Intervento della forza pubblica'],
      correct: 0,
      reveal: 'Giolitti scelse la neutralità. Era la scelta meno ovvia: uno sciopero generale politico era esattamente il tipo di agitazione che i governi precedenti avrebbero represso con la forza. Ma Giolitti ragionò diversamente: la repressione avrebbe trasformato uno sciopero di protesta in un\'insurrezione, e una vittoria dei sindacati sullo Stato in piazza. Lasciandolo sfogare, lo neutralizzò. Fu la dimostrazione pratica del metodo: includere il conflitto dentro la legge, anche quando il conflitto è politico, è meno pericoloso che escluderlo.'
    }
  },
  {
    num: 2,
    year: '1901–1907',
    title: 'Le leghe contadine in Emilia',
    text: 'Emilia, primi anni del Novecento. Le leghe bianche e rosse dei braccianti organizzano scioperi agricoli per strappare ai proprietari terrieri aumenti dei salari giornalieri, riduzione dell\'orario di lavoro, imponibile di manodopera — l\'obbligo di assumere un numero minimo di lavoratori locali per ogni ettaro coltivato. Le agitazioni sono stagionali, coincidono con i periodi più critici per il raccolto, e usano il momento di maggiore vulnerabilità del padrone come leva contrattuale. I prefetti ricevono pressioni continue dai proprietari per disperdere i picchetti.',
    step1: {
      prompt: 'Come classificheresti questa agitazione?',
      opts: ['Sciopero economico', 'Sciopero politico'],
      correct: 0,
      reveal: 'Sciopero economico — e Giolitti lo trattò come tale, con una scelta che ruppe nettamente con i governi precedenti. Rifiutò di mandare le truppe a proteggere i raccolti dei proprietari, come era stato fatto sistematicamente fino ad allora. Le leghe avevano il diritto di scioperare; i proprietari avevano il diritto di resistere o cedere. Lo Stato non doveva scegliere tra le parti. In molte zone dell\'Emilia i proprietari cedettero, e i salari agricoli aumentarono sensibilmente nel giro di pochi anni: fu una redistribuzione reale, ottenuta dentro la legge.'
    },
    step2: {
      prompt: 'Quale dovrebbe essere la risposta dello Stato?',
      opts: ['Neutralità — non intervenire', 'Mediazione tramite conciliazione', 'Intervento della forza pubblica'],
      correct: 0,
      reveal: 'Neutralità. Giolitti non mandò la forza pubblica a proteggere i fondi dei proprietari né a disperdere i picchetti. Ordinò ai prefetti di mantenere l\'ordine pubblico — impedire violenze fisiche — ma di non schierarsi sul merito della vertenza contrattuale. Per i proprietari terrieri abituati a considerare l\'esercito un loro diritto acquisito fu uno shock. Per i braccianti fu la prima volta che lo Stato non era automaticamente il loro nemico. Era esattamente la distinzione che Giolitti voleva incidere nella pratica di governo: lo Stato arbitro, non strumento di una classe.'
    }
  },
  {
    num: 3,
    year: '1905–1906',
    title: 'L\'agitazione dei ferrovieri dopo la nazionalizzazione',
    text: 'Dopo la nazionalizzazione delle ferrovie del 1905, i lavoratori ferroviari diventano dipendenti statali. Pochi mesi dopo, le associazioni di categoria avanzano richieste di miglioramento salariale e di modifica degli orari di servizio. Le trattative con il ministero si arenano. I sindacati minacciano uno sciopero. La questione è inedita: i ferrovieri non lavorano per un padrone privato ma per lo Stato, e un loro sciopero bloccherebbe un servizio pubblico essenziale. Alcuni esponenti governativi propongono di vietare per legge lo sciopero ai dipendenti statali.',
    step1: {
      prompt: 'Come classificheresti questa agitazione?',
      opts: ['Sciopero economico', 'Sciopero politico'],
      correct: 0,
      reveal: 'Le rivendicazioni erano economiche — salari, orari — ma la posizione di Giolitti era complicata dalla nazionalizzazione: lo Stato era al tempo stesso datore di lavoro e garante dell\'ordine pubblico. Uno sciopero dei ferrovieri era economico nel movente ma politico nelle conseguenze: colpiva un servizio che il Parlamento aveva appena deciso di statalizzare proprio per garantirne la continuità. Giolitti non vietò lo sciopero ai dipendenti statali — la proposta fu respinta — ma aprì trattative accelerate, che portarono a concessioni parziali prima che l\'agitazione degenerasse.'
    },
    step2: {
      prompt: 'Quale dovrebbe essere la risposta dello Stato?',
      opts: ['Neutralità — non intervenire', 'Mediazione tramite conciliazione', 'Intervento della forza pubblica'],
      correct: 1,
      reveal: 'Mediazione. Il caso dei ferrovieri era quello in cui la neutralità giolittiana aveva i limiti più evidenti: lo Stato non poteva essere al tempo stesso neutrale e datore di lavoro. Giolitti scelse la mediazione attraverso commissioni paritetiche, ottenendo un accordo che aumentò parzialmente le retribuzioni e migliorò alcune condizioni di servizio. Non risolse la tensione strutturale — il problema dei servizi pubblici e del diritto di sciopero dei dipendenti statali sarebbe rimasto aperto per tutto il periodo giolittiano — ma rimandò la crisi e impedì un confronto aperto che avrebbe messo in contraddizione il suo stesso metodo.'
    }
  },
  {
    num: 4,
    year: '1907',
    title: 'Un\'agitazione che cambia natura',
    text: 'Una città industriale del Nord, estate 1907. Un\'agitazione inizia come sciopero salariale in una grande fabbrica tessile: i lavoratori chiedono un aumento del 10% e la riduzione dell\'orario da undici a dieci ore. Il padrone resiste. Dopo quattro giorni, il sindacato proclama la solidarietà di altri settori produttivi; dopo sette, i manifestanti iniziano a bloccare l\'accesso alla fabbrica impedendo agli operai non scioperanti di entrare. Al decimo giorno, un comizio in piazza denuncia "il sistema capitalista" e chiede l\'intervento del Comune a sostegno degli scioperanti. La prefettura chiede istruzioni urgenti a Roma.',
    ambiguous: true,
    step1: {
      prompt: 'Come classificheresti questa agitazione?',
      opts: ['Sciopero economico', 'Sciopero politico'],
      correct: -1,
      revealAmbiguous: 'Questa è la domanda che non ha risposta univoca — ed è il punto centrale del caso. All\'inizio era uno sciopero economico: rivendicazioni salariali precise, interlocutore privato identificabile. Al decimo giorno sembrava qualcosa di più. Ma Giolitti avrebbe potuto rispondere: la retorica politica di un comizio non cambia la natura contrattuale della vertenza. O poteva rispondere: il blocco degli accessi e il coinvolgimento del Comune trasformano lo sciopero in pressione politica. Entrambe le letture erano difendibili. Lo stesso episodio, osservato al giorno uno e al giorno dieci, sembrava un caso diverso. La distinzione tra sciopero economico e politico non era una linea netta: era una valutazione, e come tale poteva cambiare.'
    },
    step2: {
      prompt: 'E la risposta dello Stato?',
      opts: ['Neutralità — non intervenire', 'Mediazione tramite conciliazione', 'Intervento della forza pubblica'],
      correct: -1,
      revealAmbiguous: 'Non c\'è una risposta corretta neanche qui. Giolitti avrebbe probabilmente scelto la mediazione, cercando di separare la componente contrattuale (su cui lo Stato poteva restare arbitro) dalla componente politica (su cui intervenire sarebbe stato necessario solo se fosse degenerata in violenza). Ma questa separazione era possibile solo finché i due piani rimanevano separabili — e non sempre lo erano. La fluidità di questo caso è il punto: lo strumento che permetteva a Giolitti di distinguere sciopero economico da sciopero politico funzionava bene nei casi chiari, ma lasciava un ampio margine di valutazione nei casi grigi. Se fosse flessibilità necessaria o arbitrio, restava la domanda.'
    }
  },
  {
    num: 5,
    year: '1904',
    title: 'L\'agitazione che minaccia i servizi essenziali',
    text: 'Una grande città, autunno 1904. I lavoratori del gas e dell\'acquedotto comunale entrano in agitazione per rivendicazioni salariali. Quando il Comune non risponde, minacciano di cessare il lavoro: niente gas per il riscaldamento domestico e l\'illuminazione pubblica, niente acqua negli ospedali. La direzione dello sciopero è chiaramente nelle mani di un\'organizzazione sindacale riconosciuta; le rivendicazioni sono circoscritte e documentate. Ma le conseguenze immediate di uno sciopero riuscito colpirebbero non i proprietari privati bensì la popolazione civile, inclusi i più vulnerabili.',
    step1: {
      prompt: 'Come classificheresti questa agitazione?',
      opts: ['Sciopero economico', 'Sciopero politico'],
      correct: 0,
      reveal: 'Sciopero economico — le rivendicazioni erano salariali, l\'interlocutore identificabile, la struttura sindacale riconosciuta. Ma il caso mostrava il limite più delicato del metodo giolittiano: la neutralità dello Stato funzionava quando lo sciopero colpiva un padrone privato. Quando colpiva la popolazione civile attraverso la sospensione di servizi essenziali, la neutralità diventava una scelta attiva a danno dei cittadini. Giolitti ne era consapevole: tenne distinto il diritto di sciopero — che non poteva essere vietato — dalla tutela dei servizi minimi essenziali, che avrebbe dovuto essere garantita per legge. La legge non arrivò mai, durante il suo governo.'
    },
    step2: {
      prompt: 'Quale dovrebbe essere la risposta dello Stato?',
      opts: ['Neutralità — non intervenire', 'Mediazione tramite conciliazione', 'Intervento della forza pubblica'],
      correct: 1,
      reveal: 'Mediazione accelerata. Giolitti non poteva permettersi né la neutralità — che avrebbe lasciato la popolazione senz\'acqua e senza luce — né l\'intervento della forza pubblica, che avrebbe contraddetto il principio di non ingerenza nelle vertenze economiche. La soluzione pratica fu la pressione informale sul Comune per accelerare le trattative e raggiungere un accordo prima che lo sciopero scattasse. Fu una mediazione che usava il peso politico del governo senza formalizzarla in procedure ufficiali. Era efficace, ma mostrava il lato non trasparente del metodo: lo stesso Giolitti che non interveniva nelle vertenze dei braccianti emiliani interveniva qui, per ragioni che non erano sempre dichiarate.'
    }
  }
];

// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
let currentCase = 0;
let step = 1; // 1 or 2
let caseElements = []; // rendered case div references

// ══════════════════════════════════════════════════════════
//  BUILD DOTS
// ══════════════════════════════════════════════════════════
function buildDots() {
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  CASES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' current' : '');
    d.id = 'dot' + i;
    dotsEl.appendChild(d);
  });
}

function updateDots(completedIdx) {
  document.getElementById('dot' + completedIdx).classList.remove('current');
  document.getElementById('dot' + completedIdx).classList.add('done');
  if (completedIdx + 1 < CASES.length) {
    document.getElementById('dot' + (completedIdx + 1)).classList.add('current');
    document.getElementById('progressText').textContent = `Caso ${completedIdx + 2} di ${CASES.length}`;
  } else {
    document.getElementById('progressText').textContent = 'Tutti i casi completati';
  }
}

// ══════════════════════════════════════════════════════════
//  RENDER CASE
// ══════════════════════════════════════════════════════════
function renderCase(idx) {
  const c = CASES[idx];
  const main = document.getElementById('main');

  const div = document.createElement('div');
  div.id = 'case' + idx;
  div.innerHTML = `
    <div class="case-card" id="card${idx}">
      <div class="case-tag">
        <span class="case-num">Caso ${c.num}</span>
        <span class="case-year">${c.year}</span>
        <span class="case-title">${c.title}</span>
      </div>
      <div class="case-body">
        <div class="case-text">${c.text}</div>

        <!-- STEP 1 -->
        <div class="step" id="step1_${idx}">
          <div class="step-prompt">${c.step1.prompt}</div>
          <div class="choices" id="choices1_${idx}">
            ${c.step1.opts.map((opt, oi) =>
              `<button class="choice-btn" onclick="pickStep1(${idx},${oi})">${opt}</button>`
            ).join('')}
          </div>
          <div class="reveal" id="reveal1_${idx}"></div>
        </div>

        <!-- STEP 2 (hidden until step 1 done) -->
        <div class="step" id="step2_${idx}" style="display:none">
          <div class="step-prompt">${c.step2.prompt}</div>
          <div class="choices" id="choices2_${idx}">
            ${c.step2.opts.map((opt, oi) =>
              `<button class="choice-btn" onclick="pickStep2(${idx},${oi})">${opt}</button>`
            ).join('')}
          </div>
          <div class="reveal" id="reveal2_${idx}"></div>
          <button class="next-btn" id="next${idx}" onclick="advanceCase(${idx})">
            ${idx < CASES.length - 1 ? 'Caso successivo →' : 'Conclusione →'}
          </button>
        </div>
      </div>
    </div>
  `;

  main.appendChild(div);
}

// ══════════════════════════════════════════════════════════
//  INTERACTIONS
// ══════════════════════════════════════════════════════════
function pickStep1(idx, chosen) {
  const c = CASES[idx];
  const btns = document.querySelectorAll(`#choices1_${idx} .choice-btn`);
  btns.forEach(b => b.disabled = true);
  btns[chosen].classList.add(c.step1.correct === -1 ? 'selected-neutral' : 'selected-neutral');
  // always neutral style for step 1 — classification is shown as the reveal

  const reveal = document.getElementById(`reveal1_${idx}`);
  if (c.ambiguous && c.step1.correct === -1) {
    reveal.className = 'reveal show ambiguous';
    reveal.innerHTML = `<div class="reveal-label ambiguous-lbl">Risposta ambigua</div><div class="reveal-text">${c.step1.revealAmbiguous}</div>`;
  } else {
    reveal.className = 'reveal show';
    reveal.innerHTML = `<div class="reveal-label">Cosa fece Giolitti</div><div class="reveal-text">${c.step1.reveal}</div>`;
  }

  // Show step 2
  setTimeout(() => {
    const s2 = document.getElementById(`step2_${idx}`);
    s2.style.display = '';
    s2.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 350);
}

function pickStep2(idx, chosen) {
  const c = CASES[idx];
  const btns = document.querySelectorAll(`#choices2_${idx} .choice-btn`);
  btns.forEach(b => b.disabled = true);
  btns[chosen].classList.add('selected-neutral');

  const reveal = document.getElementById(`reveal2_${idx}`);
  if (c.ambiguous && c.step2.correct === -1) {
    reveal.className = 'reveal show ambiguous';
    reveal.innerHTML = `<div class="reveal-label ambiguous-lbl">Nessuna risposta univoca</div><div class="reveal-text">${c.step2.revealAmbiguous}</div>`;
  } else {
    reveal.className = 'reveal show';
    reveal.innerHTML = `<div class="reveal-label">Cosa fece Giolitti</div><div class="reveal-text">${c.step2.reveal}</div>`;
  }

  document.getElementById(`next${idx}`).classList.add('show');
  setTimeout(() => {
    document.getElementById(`next${idx}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 200);
}

function advanceCase(idx) {
  updateDots(idx);
  if (idx + 1 < CASES.length) {
    renderCase(idx + 1);
    setTimeout(() => {
      document.getElementById('case' + (idx + 1)).scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  } else {
    showClosing();
  }
}

function showClosing() {
  const main = document.getElementById('main');
  const closing = document.createElement('div');
  closing.className = 'closing show';
  closing.innerHTML = `
    <div class="closing-label">In conclusione</div>
    <div class="closing-text">
      Cinque casi. In tre era abbastanza chiaro come procedere; in uno la risposta giusta dipendeva dal datore di lavoro, non dalla natura dell'agitazione; in uno non c'era risposta univoca.<br><br>
      Questo è il punto che i cinque casi volevano mostrare: <strong>lo stesso strumento che permette allo Stato di includere un conflitto dentro la legge permette anche di deciderne, caso per caso, la legittimità.</strong> La distinzione tra sciopero economico e sciopero politico non era incisa nella natura delle cose — era una valutazione, e come tale aveva margini.<br><br>
      Resta da stabilire se questo fosse un margine di flessibilità necessario in un sistema che stava imparando a convivere con il conflitto sociale, o un margine di arbitrio che lasciava alla discrezionalità del governo la scelta di chi includere e chi escludere. È la domanda che il primo nodo storiografico del capitolo riprende per esteso.
    </div>
  `;
  main.appendChild(closing);
  setTimeout(() => closing.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

// ══════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════
buildDots();
renderCase(0);
</script>
