<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il paradosso del finanziamento asiatico</title>
<style>
  :root{--grigio:#F2F2F2; --marrone:#8B7355; --marrone-scuro:#6b5940; --card:#fffdfa; --testo:#2b2620; --flusso:#9c5b45;}
  *{box-sizing:border-box;}
  body{margin:0;padding:24px 20px 32px;background:var(--grigio);font-family:Georgia,serif;color:var(--testo);}
  h1{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:1.3rem;text-align:center;margin:0 0 4px;color:var(--marrone-scuro);}
  .sottotitolo{text-align:center;font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:0.85rem;color:#5a5348;margin:0 0 18px;}
  .wrap{max-width:820px;margin:0 auto;}

  .diagram-box{background:var(--card);border:1px solid var(--marrone);border-radius:10px;padding:16px;}
  svg{width:100%;height:auto;display:block;}
  .box{fill:#fffdfa;stroke:var(--marrone);stroke-width:1.5;}
  .box.dim{opacity:0.3;}
  .box.active{stroke:var(--marrone-scuro);stroke-width:3;}
  .boxlabel{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:12px;fill:var(--testo);text-anchor:middle;}
  .boxlabel.dim{opacity:0.3;}
  .arc{fill:none;stroke:#d8d2c4;stroke-width:3;}
  .arc.active{stroke:var(--flusso);}

  .controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:16px 0;}
  .navbtn{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-weight:bold;background:var(--marrone);color:#fff;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:0.9rem;}
  .navbtn:disabled{opacity:0.4;cursor:default;}
  .steps-dots{display:flex;gap:8px;}
  .step-dot{width:10px;height:10px;border-radius:50%;background:#d8d2c4;cursor:pointer;}
  .step-dot.active{background:var(--marrone);}

  #scheda{background:var(--card);border:1px solid var(--marrone);border-left:6px solid var(--marrone);border-radius:8px;padding:16px 20px;}
  #scheda h2{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:1.05rem;margin:0 0 8px;color:var(--marrone-scuro);}
  #scheda p{margin:0;line-height:1.55;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Il paradosso del finanziamento asiatico</h1>
  <p class="sottotitolo">Chi presta a chi: un circuito, non un rapporto a senso unico</p>

  <div class="diagram-box">
    <svg viewBox="0 0 640 520" id="diagram">
      <g id="box0"><rect class="box" x="70" y="20" width="220" height="70" rx="8"/><text class="boxlabel" x="180" y="50">Consumatori americani</text><text class="boxlabel" x="180" y="68">comprano beni cinesi a credito</text></g>
      <g id="box1"><rect class="box" x="350" y="140" width="220" height="70" rx="8"/><text class="boxlabel" x="460" y="170">La Cina incassa dollari</text><text class="boxlabel" x="460" y="188">dal surplus commerciale</text></g>
      <g id="box2"><rect class="box" x="350" y="290" width="220" height="70" rx="8"/><text class="boxlabel" x="460" y="320">Li reinveste in titoli</text><text class="boxlabel" x="460" y="338">del debito pubblico USA</text></g>
      <g id="box3"><rect class="box" x="70" y="410" width="220" height="70" rx="8"/><text class="boxlabel" x="180" y="440">Il debito pubblico USA finanzia</text><text class="boxlabel" x="180" y="458">anche il salvataggio delle banche (2008)</text></g>

      <path id="arc0" class="arc" d="M290,60 C330,80 350,110 370,145" marker-end="url(#arh)"/>
      <path id="arc1" class="arc" d="M460,210 L460,290" marker-end="url(#arh)"/>
      <path id="arc2" class="arc" d="M350,335 C300,370 250,395 220,412" marker-end="url(#arh)"/>
      <path id="arc3" class="arc" d="M120,410 C60,320 60,150 90,90" marker-end="url(#arh)"/>

      <defs><marker id="arh" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9c5b45"/></marker></defs>
    </svg>
  </div>

  <div class="controls">
    <button class="navbtn" id="prevBtn">← Indietro</button>
    <div class="steps-dots" id="dots"></div>
    <button class="navbtn" id="nextBtn">Avanti →</button>
  </div>

  <div id="scheda"></div>
</div>

<script>
const steps = [
  {boxes:[0], arcs:[], titolo:"I consumatori americani comprano a credito", testo:"I consumatori statunitensi continuano a comprare beni di consumo cinesi, spesso a credito."},
  {boxes:[0,1], arcs:['arc0'], titolo:"La Cina incassa dollari", testo:"La Cina vende beni agli americani e incassa dollari su scala crescente, accumulando riserve valutarie colossali."},
  {boxes:[0,1,2], arcs:['arc0','arc1'], titolo:"La Cina compra debito pubblico americano", testo:"Anziché reinvestire quei dollari solo in patria, la Cina (insieme al Giappone) li impiega in larga parte nell'acquisto di titoli del debito pubblico statunitense, ritenuti il porto più sicuro al mondo."},
  {boxes:[0,1,2,3], arcs:['arc0','arc1','arc2'], titolo:"Il debito pubblico USA finanzia il salvataggio delle banche", testo:"Quel debito pubblico finanzia, tra l'altro, il salvataggio delle banche americane nel 2008: il denaro cinese sostiene indirettamente il sistema finanziario che ha causato la crisi."},
  {boxes:[0,1,2,3], arcs:['arc0','arc1','arc2','arc3'], titolo:"Un'interdipendenza reciproca, non un rapporto di forza unilaterale", testo:"Il circuito si chiude: permettendo ai consumatori americani di continuare a comprare a credito, il finanziamento cinese rende possibile la domanda che assorbe le stesse esportazioni cinesi. Gli Stati Uniti dipendono dalla disponibilità di Cina e Giappone a comprare il proprio debito; Pechino e Tokyo, detenendo enormi quantità di titoli americani, hanno ogni interesse a evitare un collasso del dollaro che eroderebbe le proprie riserve. Nessun singolo governo, nemmeno quello della prima potenza economica mondiale, può dire di controllare da solo questo pendolo."}
];

let current = 0;
function render(){
  const s = steps[current];
  for(let i=0;i<4;i++){
    const box = document.getElementById('box'+i);
    const rect = box.querySelector('rect');
    const labels = box.querySelectorAll('text');
    const visible = s.boxes.includes(i);
    rect.classList.toggle('dim', !visible);
    rect.classList.toggle('active', visible && i===Math.max(...s.boxes));
    labels.forEach(l=>l.classList.toggle('dim', !visible));
  }
  document.querySelectorAll('.arc').forEach(a=>a.classList.remove('active'));
  s.arcs.forEach(id=>document.getElementById(id).classList.add('active'));

  document.getElementById('scheda').innerHTML = `<h2>${s.titolo}</h2><p>${s.testo}</p>`;
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===steps.length-1;
  document.querySelectorAll('.step-dot').forEach((d,i)=>d.classList.toggle('active', i===current));
}

const dotsWrap = document.getElementById('dots');
steps.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className='step-dot';
  d.addEventListener('click', ()=>{current=i; render();});
  dotsWrap.appendChild(d);
});
document.getElementById('prevBtn').addEventListener('click', ()=>{if(current>0){current--; render();}});
document.getElementById('nextBtn').addEventListener('click', ()=>{if(current<steps.length-1){current++; render();}});

render();
</script>
</body>
</html>
