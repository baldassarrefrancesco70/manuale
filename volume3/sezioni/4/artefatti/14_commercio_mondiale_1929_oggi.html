<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il commercio mondiale, 1929-oggi</title>
<style>
  :root{--grigio:#F2F2F2; --marrone:#8B7355; --marrone-scuro:#6b5940; --card:#fffdfa; --testo:#2b2620; --linea:#5b7a8f; --linea2:#b08d57;}
  *{box-sizing:border-box;}
  body{margin:0;padding:24px 20px 32px;background:var(--grigio);font-family:Georgia,serif;color:var(--testo);}
  h1{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:1.3rem;text-align:center;margin:0 0 4px;color:var(--marrone-scuro);}
  .sottotitolo{text-align:center;font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:0.85rem;color:#5a5348;margin:0 0 18px;}
  .wrap{max-width:920px;margin:0 auto;}

  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:14px;}
  .chip{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:0.82rem;font-weight:bold;padding:8px 14px;border-radius:18px;border:2px solid var(--marrone);background:#fff;color:var(--marrone-scuro);cursor:pointer;opacity:0.55;}
  .chip.active{opacity:1;background:var(--marrone);color:#fff;}
  .chip2{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:0.8rem;padding:7px 14px;border-radius:16px;border:1px solid var(--linea2);background:#fff;color:var(--linea2);cursor:pointer;}
  .chip2.active{background:var(--linea2);color:#fff;}

  .chart-box{background:var(--card);border:1px solid var(--marrone);border-radius:10px;padding:16px;}
  svg{width:100%;height:auto;display:block;}
  .gridline{stroke:#e3ddd0;stroke-width:1;}
  .annot-text{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:11px;fill:#7a6f5c;}
  .finestra{fill:#9c5b45;opacity:0;transition:opacity .3s;}
  .finestra.show{opacity:0.15;}
  .finestra-label{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:11.5px;fill:var(--marrone-scuro);font-weight:bold;opacity:0;transition:opacity .3s;text-anchor:middle;}
  .finestra-label.show{opacity:1;}
  .linea{fill:none;stroke:var(--linea);stroke-width:3;}
  .linea2{fill:none;stroke:var(--linea2);stroke-width:2.5;stroke-dasharray:5 4;opacity:0;transition:opacity .3s;}
  .linea2.show{opacity:1;}
  .dot{cursor:pointer;}
  .tooltip{position:absolute;background:var(--marrone-scuro);color:#fff;font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:0.78rem;padding:6px 10px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:10;}
  .legend{display:flex;justify-content:center;gap:18px;font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:0.78rem;color:#5a5348;margin-top:8px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:14px;height:4px;display:inline-block;border-radius:2px;}
  .nota-metodo{max-width:760px;margin:14px auto 0;text-align:center;font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:0.75rem;color:#7a6f5c;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Il commercio mondiale, 1929-oggi</h1>
  <p class="sottotitolo">Crolli e riprese a confronto</p>

  <div class="controls">
    <button class="chip active" data-w="w1929">1929-1932 (-60%)</button>
    <button class="chip active" data-w="w2008">2008-2009 (-20%)</button>
    <button class="chip active" data-w="w2015">2015 (-7%)</button>
    <button class="chip2" id="toggleAsse2">+ interscambio globale in % del PIL mondiale</button>
  </div>

  <div class="chart-box">
    <svg id="chart" viewBox="0 0 900 420"></svg>
  </div>
  <div class="tooltip" id="tooltip"></div>
  <div class="legend">
    <span><span class="swatch" style="background:var(--linea)"></span>valore del commercio mondiale (indice)</span>
    <span><span class="swatch" style="background:var(--linea2)"></span>interscambio globale / PIL mondiale (%)</span>
  </div>

</div>

<script>
const years = [1929,1932,1938,1950,1960,1970,1980,1990,2000,2008,2009,2015,2023];
const trade = [100, 40,  55,  70,  110, 350, 500, 650, 850, 1150, 920, 1300, 1500];
const ratio = [null,null,null,null,null,null,28,  32,  40,  52,   44,  47,   45];

const svg = document.getElementById('chart');
const W=900,H=420,M={t:20,r:50,b:40,l:55};
const plotW=W-M.l-M.r, plotH=H-M.t-M.b;
const xScale = i => M.l + (i/(years.length-1))*plotW;
const yMax = 1600;
const yScale = v => M.t + plotH - (v/yMax)*plotH;
const y2Max = 60;
const y2Scale = v => M.t + plotH - (v/y2Max)*plotH;

function idxOfYear(y){ return years.indexOf(y); }

let html='';
for(let v=0; v<=yMax; v+=200){
  html += `<line class="gridline" x1="${M.l}" y1="${yScale(v)}" x2="${W-M.r}" y2="${yScale(v)}"/>`;
  html += `<text class="annot-text" x="${M.l-8}" y="${yScale(v)+4}" text-anchor="end">${v}</text>`;
}
years.forEach((y,i)=>{
  html += `<text class="annot-text" x="${xScale(i)}" y="${H-M.b+18}" text-anchor="middle">${y}</text>`;
});
// right axis for ratio
for(let v=0; v<=y2Max; v+=10){
  html += `<text class="annot-text" x="${W-M.r+8}" y="${y2Scale(v)+4}" text-anchor="start" fill="#b08d57">${v}%</text>`;
}

// windows
html += `<rect class="finestra" id="fin-w1929" x="${xScale(0)}" y="${M.t}" width="${xScale(1)-xScale(0)}" height="${plotH}"/>`;
html += `<text class="finestra-label" id="lab-w1929" x="${(xScale(0)+xScale(1))/2}" y="${M.t+14}">-60%</text>`;
html += `<rect class="finestra" id="fin-w2008" x="${xScale(idxOfYear(2008))}" y="${M.t}" width="${xScale(idxOfYear(2009))-xScale(idxOfYear(2008))}" height="${plotH}"/>`;
html += `<text class="finestra-label" id="lab-w2008" x="${(xScale(idxOfYear(2008))+xScale(idxOfYear(2009)))/2}" y="${M.t+14}">-20%</text>`;
html += `<rect class="finestra" id="fin-w2015" x="${xScale(idxOfYear(2015))-6}" y="${M.t}" width="12" height="${plotH}"/>`;
html += `<text class="finestra-label" id="lab-w2015" x="${xScale(idxOfYear(2015))}" y="${M.t+14}">-7%</text>`;

const pts = trade.map((v,i)=> xScale(i)+','+yScale(v)).join(' ');
html += `<polyline class="linea" points="${pts}"/>`;

const ratioPts = years.map((y,i)=>ratio[i]!==null ? xScale(i)+','+y2Scale(ratio[i]) : null).filter(Boolean).join(' ');
html += `<polyline class="linea2" id="lineaRatio" points="${ratioPts}"/>`;

trade.forEach((v,i)=>{
  html += `<circle class="dot" cx="${xScale(i)}" cy="${yScale(v)}" r="4.5" fill="#5b7a8f" data-year="${years[i]}" data-val="${v}" data-type="commercio"/>`;
});
years.forEach((y,i)=>{
  if(ratio[i]!==null){
    html += `<circle class="dot ratio-dot" cx="${xScale(i)}" cy="${y2Scale(ratio[i])}" r="4" fill="#b08d57" data-year="${y}" data-val="${ratio[i]}" data-type="rapporto" style="display:none"/>`;
  }
});

svg.innerHTML = html;

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    chip.classList.toggle('active');
    const w = chip.dataset.w;
    document.getElementById('fin-'+w).classList.toggle('show');
    document.getElementById('lab-'+w).classList.toggle('show');
  });
});
document.querySelectorAll('.chip.active').forEach(chip=>{
  const w = chip.dataset.w;
  document.getElementById('fin-'+w).classList.add('show');
  document.getElementById('lab-'+w).classList.add('show');
});

document.getElementById('toggleAsse2').addEventListener('click', function(){
  this.classList.toggle('active');
  document.getElementById('lineaRatio').classList.toggle('show');
  document.querySelectorAll('.ratio-dot').forEach(d=>{
    d.style.display = this.classList.contains('active') ? '' : 'none';
  });
});

const tooltip = document.getElementById('tooltip');
svg.addEventListener('mousemove', (e)=>{
  if(e.target.tagName==='circle' && e.target.style.display !== 'none'){
    tooltip.style.opacity=1;
    tooltip.style.left=(e.pageX+12)+'px';
    tooltip.style.top=(e.pageY-30)+'px';
    if(e.target.dataset.type==='commercio'){
      tooltip.textContent = e.target.dataset.year+': indice commercio '+e.target.dataset.val;
    } else {
      tooltip.textContent = e.target.dataset.year+': interscambio/PIL '+e.target.dataset.val+'%';
    }
  } else {
    tooltip.style.opacity=0;
  }
});
</script>
</body>
</html>
