<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il riciclaggio dei petrodollari</title>
<style>
  :root{--grigio:#F2F2F2; --marrone:#8B7355; --marrone-scuro:#6b5940; --card:#fffdfa; --testo:#2b2620; --flusso:#9c5b45;}
  *{box-sizing:border-box;}
  body{margin:0;padding:24px 20px 32px;background:var(--grigio);font-family:Georgia,serif;color:var(--testo);}
  h1{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:1.3rem;text-align:center;margin:0 0 4px;color:var(--marrone-scuro);}
  .sottotitolo{text-align:center;font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:0.85rem;color:#5a5348;margin:0 0 18px;}
  .wrap{max-width:940px;margin:0 auto;}

  .diagram-box{background:var(--card);border:1px solid var(--marrone);border-radius:10px;padding:16px;}
  svg{width:100%;height:auto;display:block;}
  .box{fill:#fffdfa;stroke:var(--marrone);stroke-width:1.5;rx:8;}
  .box.dim{opacity:0.35;}
  .box.active{stroke:var(--marrone-scuro);stroke-width:3;}
  .boxlabel{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:12.5px;fill:var(--testo);text-anchor:middle;}
  .boxlabel.dim{opacity:0.35;}
  .arrow-path{fill:none;stroke:#d8d2c4;stroke-width:3;}
  .arrow-path.active{stroke:var(--flusso);}
  .flow-dot{fill:var(--flusso);opacity:0;}
  .flow-dot.active{opacity:1;}

  .controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:16px 0;}
  .navbtn{
    font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-weight:bold;
    background:var(--marrone);color:#fff;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:0.9rem;
  }
  .navbtn:disabled{opacity:0.4;cursor:default;}
  .steps-dots{display:flex;gap:8px;}
  .step-dot{width:10px;height:10px;border-radius:50%;background:#d8d2c4;cursor:pointer;}
  .step-dot.active{background:var(--marrone);}

  #scheda{background:var(--card);border:1px solid var(--marrone);border-left:6px solid var(--marrone);border-radius:8px;padding:16px 20px;}
  #scheda h2{font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:1.05rem;margin:0 0 8px;color:var(--marrone-scuro);}
  #scheda p{margin:0 0 8px;line-height:1.55;}
  .cifra{display:inline-block;background:var(--grigio);border:1px solid var(--marrone);border-radius:6px;padding:3px 10px;font-family:'Gill Sans','Gill Sans MT',Calibri,sans-serif;font-size:0.85rem;font-weight:bold;color:var(--marrone-scuro);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Il riciclaggio dei petrodollari</h1>
  <p class="sottotitolo">Dal Golfo a Wall Street al Terzo Mondo: un circuito, non una sequenza di eventi scollegati</p>

  <div class="diagram-box">
    <svg viewBox="0 0 900 260" id="diagram">
      <!-- boxes -->
      <g id="box0"><rect class="box" x="20" y="100" width="150" height="60" rx="8"/><text class="boxlabel" x="95" y="125">Paesi OPEC</text><text class="boxlabel" x="95" y="142">(esportatori di petrolio)</text></g>
      <g id="box1"><rect class="box" x="220" y="100" width="170" height="60" rx="8"/><text class="boxlabel" x="305" y="122">Banche di Londra</text><text class="boxlabel" x="305" y="138">e New York</text><text class="boxlabel" x="305" y="154">(mercato eurodollari)</text></g>
      <g id="box2"><rect class="box" x="440" y="100" width="200" height="60" rx="8"/><text class="boxlabel" x="540" y="122">Prestiti a paesi</text><text class="boxlabel" x="540" y="138">dell'America Latina</text><text class="boxlabel" x="540" y="154">e dell'Africa</text></g>
      <g id="box3"><rect class="box" x="690" y="20" width="190" height="60" rx="8"/><text class="boxlabel" x="785" y="42">Rialzo dei tassi USA</text><text class="boxlabel" x="785" y="58">(fine anni Settanta)</text></g>
      <g id="box4"><rect class="box" x="690" y="170" width="190" height="60" rx="8"/><text class="boxlabel" x="785" y="192">Moratoria messicana</text><text class="boxlabel" x="785" y="208">(1982)</text></g>

      <!-- arrows -->
      <path id="path0" class="arrow-path" d="M170,130 L220,130" marker-end="url(#arrH)"/>
      <path id="path1" class="arrow-path" d="M390,130 L440,130" marker-end="url(#arrH)"/>
      <path id="path2" class="arrow-path" d="M640,120 C660,90 665,70 690,55" marker-end="url(#arrH)"/>
      <path id="path3" class="arrow-path" d="M690,60 C610,80 560,100 545,100" marker-end="url(#arrH)"/>
      <path id="path4" class="arrow-path" d="M640,145 C660,175 665,190 690,200" marker-end="url(#arrH)"/>

      <defs><marker id="arrH" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9c5b45"/></marker></defs>

      <circle id="dot0" class="flow-dot" r="5" cx="170" cy="130"/>
      <circle id="dot1" class="flow-dot" r="5" cx="390" cy="130"/>
      <circle id="dot2" class="flow-dot" r="5" cx="665" cy="75"/>
      <circle id="dot3" class="flow-dot" r="5" cx="565" cy="95"/>
      <circle id="dot4" class="flow-dot" r="5" cx="665" cy="185"/>
    </svg>
  </div>

  <div class="controls">
    <button class="navbtn" id="prevBtn">← Indietro</button>
    <div class="steps-dots" id="dots"></div>
    <button class="navbtn" id="nextBtn">Avanti →</button>
  </div>

  <div id="scheda"></div>
</div>

<script>
const steps = [
  {boxes:[0], paths:[], dots:[], titolo:"Il punto di partenza: i paesi OPEC", testo:"Tra il 1973 e il 1976 il rincaro del greggio trasferisce ogni anno ricchezza dai paesi consumatori occidentali ai produttori dell'OPEC.", cifra:"circa 70 miliardi di dollari trasferiti ogni anno, 1973-1976"},
  {boxes:[0,1], paths:['path0'], dots:['dot0'], titolo:"I depositi a Londra e New York", testo:"Privi di mercati interni capaci di assorbire una simile massa di capitali, i paesi OPEC depositano i dollari presso le grandi banche internazionali, alimentando il mercato degli eurodollari: dollari scambiati fuori dagli Stati Uniti e quindi fuori dalla vigilanza americana.", cifra:""},
  {boxes:[0,1,2], paths:['path0','path1'], dots:['dot0','dot1'], titolo:"I prestiti al Terzo Mondo", testo:"Le banche occidentali, per far fruttare questa liquidità, la prestano con disinvoltura ai paesi in via di sviluppo dell'America Latina e dell'Africa, desiderosi di finanziare la propria modernizzazione industriale. Il meccanismo tiene finché i tassi restano bassi.", cifra:""},
  {boxes:[0,1,2,3], paths:['path0','path1','path2'], dots:['dot0','dot1','dot2'], titolo:"Gli Stati Uniti alzano i tassi", testo:"A fine decennio gli Stati Uniti alzano drasticamente i tassi di interesse per combattere la propria inflazione interna.", cifra:""},
  {boxes:[0,1,2,3,4], paths:['path0','path1','path2','path3','path4'], dots:['dot0','dot1','dot3','dot4'], titolo:"Il costo del debito esplode: Città del Messico, 1982", testo:"Il costo dei debiti contratti a tassi variabili esplode. Nel 1982 il Messico dichiara la moratoria sul proprio debito estero, aprendo una crisi che trascina oltre cento paesi poveri verso l'insolvenza, sotto la tutela del Fondo Monetario Internazionale.", cifra:"un circuito, non una sequenza di eventi scollegati: un barile pagato più caro a Londra si trasforma in una crisi del debito a Città del Messico"}
];

let current = 0;
const svgEls = { boxes:[0,1,2,3,4].map(i=>document.getElementById('box'+i)), labels:null };

function render(){
  const s = steps[current];
  for(let i=0;i<5;i++){
    const box = document.getElementById('box'+i);
    const rect = box.querySelector('rect');
    const labels = box.querySelectorAll('text');
    const visible = s.boxes.includes(i);
    rect.classList.toggle('dim', !visible);
    rect.classList.toggle('active', visible && i===Math.max(...s.boxes));
    labels.forEach(l=>l.classList.toggle('dim', !visible));
  }
  document.querySelectorAll('.arrow-path').forEach(p=>p.classList.remove('active'));
  s.paths.forEach(id=>document.getElementById(id).classList.add('active'));
  document.querySelectorAll('.flow-dot').forEach(d=>d.classList.remove('active'));
  s.dots.forEach(id=>document.getElementById(id).classList.add('active'));

  document.getElementById('scheda').innerHTML = `<h2>${s.titolo}</h2><p>${s.testo}</p>` + (s.cifra ? `<div class="cifra">${s.cifra}</div>` : '');

  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===steps.length-1;

  document.querySelectorAll('.step-dot').forEach((d,i)=>d.classList.toggle('active', i===current));
}

const dotsWrap = document.getElementById('dots');
steps.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'step-dot';
  d.addEventListener('click', ()=>{ current = i; render(); });
  dotsWrap.appendChild(d);
});

document.getElementById('prevBtn').addEventListener('click', ()=>{ if(current>0){current--; render();} });
document.getElementById('nextBtn').addEventListener('click', ()=>{ if(current<steps.length-1){current++; render();} });

render();
</script>
</body>
</html>
