          {t:"Il termine «totalitario» nacque come insulto degli antifascisti italiani, poi rivendicato con orgoglio da Mussolini stesso.", c:"nondecide"},
          {t:"In Germania il potere ruotava attorno al Führerprinzip, senza alcun contrappeso istituzionale residuo.", c:"nondecide"}
        ],
        calibratura: [
          "Il fascismo fu un totalitarismo pieno, non diverso dal nazismo.",
          "Fu totalitario per la pretesa e per gli strumenti impiegati, ma restò imperfetto per la persistenza di un contropotere reale (la monarchia).",
          "Il fascismo non fu mai un vero totalitarismo, restò una dittatura autoritaria con ambizioni totalitarie mai realizzate fino in fondo."
        ]
      },
      { q: "Le leggi razziste italiane: imitazione o impianto autonomo?",
        tesi: "Le leggi razziste italiane del 1938 furono un'imitazione tardiva di Norimberga, imposta per compiacere l'alleato tedesco.",
        statements: [
          {t:"Le leggi arrivarono nel 1938, dopo l'Asse Roma-Berlino e dopo che il regime aveva già importato altri elementi di facciata dalla Germania.", c:"sostiene"},
          {t:"Il razzismo di dominio era già codificato in Africa Orientale Italiana, prima ancora che nascesse l'antisemitismo di Stato in Italia (regio decreto del 19 aprile 1937).", c:"confuta"},
          {t:"In alcuni ambiti la legislazione italiana fu, per un periodo, più drastica di quella tedesca coeva (espulsione dei docenti ebrei, 5 settembre 1938, precedette misure scolastiche tedesche altrettanto totali).", c:"confuta"},
          {t:"Il razzismo italiano ebbe un carattere più «politico» che «biologico»: un prodotto interno dell'ideologia fascista, non un calco della teoria ariana tedesca.", c:"confuta"},
          {t:"Il Manifesto della razza fu pubblicato nel luglio 1938.", c:"nondecide"},
          {t:"Circa duecentomila ebrei fuggirono dalla Germania fra il 1933 e il 1939.", c:"nondecide"}
        ],
        calibratura: [
          "Le leggi razziste italiane furono un'imitazione tardiva di Norimberga.",
          "Furono un'imitazione nel tempismo (dopo l'Asse) ma un impianto autonomo nei contenuti e nelle radici (il laboratorio coloniale).",
          "Le leggi razziste italiane furono un impianto interamente autonomo, indipendente dall'alleanza con la Germania."
        ]
      }
    ]},
    { chapter: "La strada verso la guerra", nodes: [
      { q: "La politica estera di Hitler seguiva un piano prestabilito o rispondeva all'opportunità?",
        tesi: "L'espansionismo tedesco degli anni Trenta seguì un piano già delineato nel Mein Kampf del 1925, eseguito con fedeltà crescente.",
        statements: [
          {t:"La distruzione dell'ordine di Versailles, l'unione di tutti i tedeschi, la conquista dello spazio vitale a est furono annunciate nel Mein Kampf e realizzate una dopo l'altra.", c:"sostiene"},
          {t:"La direzione di marcia (spazio vitale a est, distruzione degli slavi come popoli) restò identica dal primo giorno all'ultimo.", c:"sostiene"},
          {t:"La rapidità stessa della rimilitarizzazione della Renania fu decisa con margini di incertezza e rischio che un piano davvero prestabilito avrebbe dovuto evitare.", c:"confuta"},
          {t:"Ogni mossa concreta sfruttò volta per volta le divisioni e la paralisi delle democrazie occidentali, più che seguire un calendario fisso.", c:"confuta"},
          {t:"Il Mein Kampf fu scritto durante la detenzione di Hitler dopo il fallito putsch di Monaco del 1923.", c:"nondecide"},
          {t:"Il riarmo tedesco fu dichiarato apertamente nel 1935.", c:"nondecide"}
        ],
        calibratura: [
          "La politica estera di Hitler seguì un piano prestabilito.",
          "Il progetto ideologico di fondo era fisso, ma il calendario e la sequenza dipesero dall'opportunità.",
          "Fu interamente opportunistica, senza alcun disegno predeterminato oltre la propaganda retrospettiva."
        ]
      },
      { q: "La guerra d'Etiopia fu l'ultimo colonialismo o la vera premessa della guerra mondiale?",
        tesi: "La guerra d'Etiopia fu il vero punto di svolta che rese possibile la Seconda guerra mondiale, non un episodio coloniale isolato.",
        statements: [
          {t:"Fu la guerra d'Etiopia a spezzare il fronte di Stresa e a isolare l'Italia dalle democrazie occidentali, spingendola verso la Germania.", c:"sostiene"},
          {t:"La remissività con cui Francia e Gran Bretagna reagirono all'aggressione convinse Hitler che l'Europa democratica non avrebbe opposto resistenze reali.", c:"sostiene"},
          {t:"Per lungo tempo la storiografia l'ha letta come l'ultimo sussulto tardivo del colonialismo ottocentesco, un episodio a sé.", c:"confuta"},
          {t:"La rimilitarizzazione della Renania, avvenuta nello stesso periodo, e la successiva Conferenza di Monaco mostrarono la stessa remissività occidentale indipendentemente dall'Etiopia.", c:"confuta"},
          {t:"L'invasione iniziò nell'ottobre 1935 e Mussolini proclamò l'Impero nel maggio 1936.", c:"nondecide"},
          {t:"Le sanzioni della Società delle Nazioni non toccavano il petrolio né vincolavano Stati Uniti e Germania.", c:"nondecide"}
        ],
        calibratura: [
          "La guerra d'Etiopia fu la vera premessa della guerra mondiale.",
          "Fu una prova decisiva ma non l'unica in una catena più lunga di episodi che mostrarono la stessa remissività occidentale.",
          "Fu l'ultimo episodio del colonialismo ottocentesco, senza un peso causale diretto sulla guerra che seguì."
        ]
      },
      { q: "Il patto Molotov-Ribbentrop fu calcolo cinico o difesa strategica?",
        tesi: "Il patto Molotov-Ribbentrop dell'agosto 1939 fu una mossa di autodifesa razionale da parte sovietica, non un'alleanza cinica fra aggressori.",
        statements: [
          {t:"A Monaco, nel 1938, Francia e Gran Bretagna avevano trattato con Hitler escludendo l'URSS dal tavolo, nonostante Mosca avesse proposto un'alleanza difensiva comune.", c:"sostiene"},
          {t:"Le trattative militari anglo-franco-sovietiche dell'estate 1939 fallirono per la diffidenza reciproca e il rifiuto di Polonia e Romania di concedere il transito all'Armata Rossa.", c:"sostiene"},
          {t:"La spartizione della Polonia e delle repubbliche baltiche, prevista nel protocollo segreto, non è un atto di prudenza ma un'occupazione pianificata in anticipo.", c:"confuta"},
          {t:"L'invasione tedesca della Polonia, resa possibile dal patto, avvenne appena una settimana dopo la firma.", c:"confuta"},
          {t:"Stalin sostituì il filo-occidentale Litvinov con Molotov il 3 maggio 1939.", c:"nondecide"},
          {t:"Il patto fu firmato il 23 agosto 1939 da Molotov e Ribbentrop a Mosca.", c:"nondecide"}
        ],
        calibratura: [
          "Il patto fu un calcolo cinico fra aggressori.",
          "Fu un calcolo cinico nella forma (i protocolli segreti di spartizione), ma con un movente difensivo reale sullo sfondo.",
          "Fu una mossa interamente difensiva e strategica, senza alcun elemento predatorio."
        ]
      }
    ]},
    { chapter: "La Repubblica dei partiti e la crisi di Tangentopoli", nodes: [
      { q: "Tangentopoli fu una rivoluzione giudiziaria o un risanamento necessario?",
        tesi: "Mani Pulite fu una rivoluzione giudiziaria che superò i propri limiti istituzionali, sostituendo la magistratura al giudizio politico degli elettori.",
        statements: [
          {t:"Le inchieste smontarono in pochi mesi un sistema di partiti che aveva governato l'Italia per quasi cinquant'anni, senza passare da un voto popolare.", c:"sostiene"},
          {t:"Il sistema dei partiti era già in una crisi profonda, aggravata da altri tre cedimenti simultanei (economico, internazionale, criminale con le stragi di mafia).", c:"confuta"},
          {t:"Il finanziamento illecito dei partiti era una pratica sistemica e diffusa, non un'invenzione dei magistrati.", c:"confuta"},
          {t:"Le inchieste di Mani Pulite iniziarono il 17 febbraio 1992.", c:"nondecide"},
          {t:"Le stragi di Capaci e via D'Amelio avvennero nello stesso anno, 1992.", c:"nondecide"}
        ],
        calibratura: [
          "Tangentopoli fu una rivoluzione giudiziaria che superò i propri limiti.",
          "Fu un intervento giudiziario legittimo su un sistema già in crisi per cause proprie, non la causa principale del crollo.",
          "Mani Pulite fu semplicemente il risanamento necessario di un sistema di corruzione sistemica, senza eccessi da correggere."
        ]
      },
      { q: "La Seconda Repubblica: rottura reale o continuità sotto altra forma?",
        tesi: "La cosiddetta «Seconda Repubblica» segna una rottura reale nella storia politica italiana rispetto al sistema dei partiti del dopoguerra.",
        statements: [
          {t:"Il sistema politico che governò l'Italia per quasi cinquant'anni si dissolse nel giro di due anni, fra il 1992 e il 1994.", c:"sostiene"},
          {t:"Nuovi soggetti politici e nuove regole elettorali sostituirono quasi integralmente i partiti storici della Prima Repubblica.", c:"sostiene"},
          {t:"Nessuna nuova Costituzione fu mai scritta: l'espressione «Seconda Repubblica» dà per acquisita proprio la rottura che dovrebbe dimostrare.", c:"confuta"},
          {t:"Molte delle logiche di fondo del sistema politico italiano (frammentazione, instabilità di governo) sopravvissero sotto forme diverse.", c:"confuta"},
          {t:"Le elezioni del 28 marzo 1994 videro l'affermazione di nuovi soggetti politici.", c:"nondecide"},
          {t:"La Costituzione del 1948 non fu mai sostituita.", c:"nondecide"}
        ],
        calibratura: [
          "La Seconda Repubblica fu una rottura reale.",
          "Fu una rottura nel sistema dei partiti e nelle regole elettorali, ma non nell'architettura costituzionale.",
          "La «Seconda Repubblica» è un'etichetta convenzionale che nasconde una sostanziale continuità con la Prima."
        ]
      }
    ]}
  ];

  const CAT_LABELS = {sostiene:"La sostiene", confuta:"La confuta", nondecide:"Non la decide"};

  // Flatten with ids and state
  let flatNodes = [];
  DATA.forEach((ch, ci) => {
    ch.nodes.forEach((n, ni) => {
      const id = ci + '-' + ni;
      flatNodes.push({
        id, chapterIdx: ci, nodeIdx: ni, chapterTitle: ch.chapter, q: n.q, tesi: n.tesi,
        statements: n.statements.map((s, si) => ({...s, id: id+'-s'+si, assigned: null})),
        calibChoice: null
      });
    });
  });

  let activeId = flatNodes[0].id;
  let compareOn = false;

  const indexList = document.getElementById('indexList');
  const mainInner = document.getElementById('mainInner');

  function isNodeDone(n){
    return n.statements.every(s => s.assigned !== null) && n.calibChoice !== null;
  }

  function renderIndex(){
    indexList.innerHTML = '';
    DATA.forEach((ch, ci) => {
      const block = document.createElement('div');
      block.className = 'chapter-block';
      const title = document.createElement('div');
      title.className = 'chapter-title';
      title.textContent = ch.chapter;
      block.appendChild(title);
      ch.nodes.forEach((n, ni) => {
        const id = ci + '-' + ni;
        const fn = flatNodes.find(f => f.id === id);
        const item = document.createElement('div');
        item.className = 'node-item' + (id === activeId ? ' active' : '');
        item.innerHTML = '<span class="node-dotstatus' + (isNodeDone(fn) ? ' done' : '') + '"></span>' + n.q;
        item.addEventListener('click', () => { activeId = id; compareOn = false; renderAll(); });
        block.appendChild(item);
      });
      indexList.appendChild(block);
    });
  }

  function renderMain(){
    const n = flatNodes.find(f => f.id === activeId);
    let html = '';
    html += '<div class="crumbs">' + n.chapterTitle + '</div>';
    html += '<div class="tesi-box"><div class="tlabel">Tesi da mettere alla prova</div><h2>' + n.tesi + '</h2></div>';
    html += '<p class="sort-instructions">Classifica ciascuna affermazione: la sostiene, la confuta, oppure non prende posizione sulla tesi. Un secondo clic sullo stesso pulsante annulla la scelta.</p>';

    html += '<button class="compare-toggle' + (compareOn ? ' on' : '') + '" id="compareBtn">' +
      (compareOn ? 'Nascondi il confronto' : 'Confronta con la lettura del capitolo') + '</button>';
    if(compareOn){
      html += '<p class="calib-note">Non è un punteggio: è la classificazione proposta dal capitolo, utile per confrontarla con la tua e discutere i casi in cui non coincidono.</p>';
    }

    const unassigned = n.statements.filter(s => s.assigned === null);
    html += '<div class="pool"><div class="pool-title">Da classificare</div>';
    if(unassigned.length === 0){
      html += '<div class="col-empty">Tutte le affermazioni sono state classificate.</div>';
    } else {
      unassigned.forEach(s => { html += statementCardHtml(s); });
    }
    html += '</div>';

    html += '<div class="columns">';
    ['sostiene','confuta','nondecide'].forEach(cat => {
      const items = n.statements.filter(s => s.assigned === cat);
      html += '<div class="col ' + cat + '"><div class="col-title">' + CAT_LABELS[cat] + '</div>';
      if(items.length === 0){ html += '<div class="col-empty">—</div>'; }
      else { items.forEach(s => { html += statementCardHtml(s); }); }
      html += '</div>';
    });
    html += '</div>';

    const allAssigned = n.statements.every(s => s.assigned !== null);
    html += '<div class="calib-section' + (allAssigned ? '' : ' locked') + '">';
    html += '<div class="calib-title">Calibratura della tesi</div>';
    if(!allAssigned){
      html += '<div class="calib-lock-msg">Classifica tutte le affermazioni per procedere alla calibratura.</div>';
    } else {
      html += '<div class="calib-note">Scegli la formulazione che, alla luce di come hai distribuito le affermazioni, ti sembra oggi più difendibile. Nessuna delle tre è indicata come corretta.</div>';
      n.calibratura.forEach((opt, oi) => {
        html += '<div class="calib-option' + (n.calibChoice === oi ? ' selected' : '') + '" data-oi="' + oi + '">' +
          '<div class="calib-radio"></div><p>' + opt + '</p></div>';
      });
      if(n.calibChoice !== null){
        html += '<div class="calib-done">Scelta registrata. Puoi cambiarla in qualsiasi momento.</div>';
      }
    }
    html += '</div>';

    html += '<button class="reset-btn" id="resetBtn">Azzera questo nodo</button>';

    mainInner.innerHTML = html;

    document.getElementById('compareBtn').addEventListener('click', () => {
      compareOn = !compareOn;
      renderAll();
    });

    mainInner.querySelectorAll('.assign-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sid = btn.dataset.sid, cat = btn.dataset.cat;
        const st = n.statements.find(s => s.id === sid);
        st.assigned = (st.assigned === cat) ? null : cat;
        renderAll();
      });
    });

    mainInner.querySelectorAll('.calib-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const oi = parseInt(opt.dataset.oi, 10);
        n.calibChoice = (n.calibChoice === oi) ? null : oi;
        renderAll();
      });
    });

    const resetBtn = document.getElementById('resetBtn');
    if(resetBtn){
      resetBtn.addEventListener('click', () => {
        n.statements.forEach(s => s.assigned = null);
        n.calibChoice = null;
        compareOn = false;
        renderAll();
      });
    }
  }

  function statementCardHtml(s){
    let html = '<div class="statement-card"><p>' + s.t + '</p><div class="assign-row">';
    ['sostiene','confuta','nondecide'].forEach(cat => {
      const active = s.assigned === cat ? ' active-' + cat : '';
      html += '<button class="assign-btn' + active + '" data-sid="' + s.id + '" data-cat="' + cat + '">' + CAT_LABELS[cat] + '</button>';
    });
    if(compareOn){
      html += '<span class="compare-tag">— lettura del capitolo: ' + CAT_LABELS[s.c] + '</span>';
    }
    html += '</div></div>';
    return html;
  }

  function renderAll(){
    renderIndex();
    renderMain();
  }

  renderAll();
})();
</script>
</body>
</html>
